name: Build Android APK and AAB for Google Play Store

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android Release App Bundle (AAB for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-voice-king-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: ludo-voice-king-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
